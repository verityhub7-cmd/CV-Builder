<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartCV — Build Your Resume</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --blue:#2563eb; --blue-dark:#1d4ed8; --blue-light:#eff6ff;
      --text:#0f172a; --text-soft:#64748b; --border:#e2e8f0;
      --bg:#f8fafc; --white:#fff; --green:#16a34a; --red:#dc2626;
    }
    body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--text); }

    /* NAVBAR */
    .navbar {
      width:100%; height:64px;
      background:white; display:flex; align-items:center; justify-content:space-between;
      padding:0 4%; box-shadow:0 1px 0 var(--border);
      position:sticky; top:0; z-index:200;
    }
    .logo { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; color:var(--blue); }
    .logo span { color:var(--text); }
    .nav-right { display:flex; gap:10px; align-items:center; }
    .back-btn {
      padding:8px 18px; border:2px solid var(--border); border-radius:8px;
      background:white; color:var(--text); font-size:13px; font-weight:600;
      cursor:pointer; text-decoration:none; transition:0.2s;
      font-family:'Plus Jakarta Sans',sans-serif;
    }
    .back-btn:hover { border-color:var(--blue); color:var(--blue); }
    .download-btn {
      padding:8px 20px; border:none; border-radius:8px;
      background:var(--blue); color:white; font-size:13px; font-weight:700;
      cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; transition:0.25s;
      box-shadow:0 3px 10px rgba(37,99,235,0.3);
    }
    .download-btn:hover { background:var(--blue-dark); transform:translateY(-1px); }

    /* PROGRESS */
    .progress-wrap { width:100%; background:#e2e8f0; height:4px; }
    .progress-bar { height:4px; background:linear-gradient(90deg,var(--blue),#4f46e5); width:0%; transition:width 0.4s; }

    /* LAYOUT */
    .builder-layout {
      display:grid;
      grid-template-columns:420px 1fr;
      min-height:calc(100vh - 68px);
    }

    /* LEFT PANEL */
    .form-panel {
      background:white;
      border-right:1px solid var(--border);
      overflow-y:auto;
      height:calc(100vh - 68px);
      position:sticky; top:68px;
    }

    .form-inner { padding:28px 28px 60px; }

    .panel-title {
      font-family:'Syne',sans-serif;
      font-size:20px; font-weight:800;
      margin-bottom:6px;
    }
    .panel-sub { font-size:13px; color:var(--text-soft); margin-bottom:24px; }

    /* TEMPLATE SWITCHER */
    .template-switcher { margin-bottom:24px; }
    .template-switcher label {
      display:block; font-size:11px; font-weight:700;
      color:var(--text-soft); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px;
    }
    .template-tabs {
      display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    }
    .t-tab {
      padding:8px 4px; border:2px solid var(--border);
      border-radius:8px; background:white; cursor:pointer;
      font-size:10px; font-weight:700; text-align:center;
      transition:all 0.2s; color:var(--text-soft);
      font-family:'Plus Jakarta Sans',sans-serif;
    }
    .t-tab:hover { border-color:var(--blue); color:var(--blue); }
    .t-tab.active { border-color:var(--blue); background:var(--blue); color:white; }
    .t-tab .t-dot {
      width:20px; height:20px; border-radius:4px;
      margin:0 auto 4px; display:block;
    }

    /* FORM SECTIONS */
    .form-section {
      background:var(--bg); border-radius:14px;
      padding:20px; margin-bottom:16px;
      border:1px solid var(--border);
    }
    .sec-head {
      display:flex; align-items:center; gap:10px; margin-bottom:18px;
      cursor:pointer; user-select:none;
    }
    .sec-icon {
      width:34px; height:34px; background:var(--blue-light);
      border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px;
    }
    .sec-head h3 { font-size:14px; font-weight:700; flex:1; }
    .sec-toggle { font-size:12px; color:var(--text-soft); transition:transform 0.3s; }
    .sec-toggle.open { transform:rotate(180deg); }
    .sec-body.hidden { display:none; }

    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .form-row.full { grid-template-columns:1fr; }
    .field { display:flex; flex-direction:column; }
    .field label { font-size:11px; font-weight:700; color:var(--text); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px; }
    .field input, .field textarea, .field select {
      padding:10px 12px; border:2px solid var(--border);
      border-radius:8px; font-size:13px;
      font-family:'Plus Jakarta Sans',sans-serif;
      color:var(--text); outline:none; transition:0.25s;
      background:white; resize:vertical;
    }
    .field input:focus, .field textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,0.08); }
    .field textarea { min-height:80px; }

    /* SKILLS */
    .skills-wrap { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .skill-tag {
      background:var(--blue-light); color:var(--blue);
      padding:5px 12px; border-radius:20px;
      font-size:12px; font-weight:600;
      display:flex; align-items:center; gap:6px;
    }
    .skill-tag button { background:none; border:none; color:var(--blue); cursor:pointer; font-size:14px; line-height:1; padding:0; }
    .skill-row { display:flex; gap:8px; }
    .skill-row input {
      flex:1; padding:10px 12px; border:2px solid var(--border);
      border-radius:8px; font-size:13px;
      font-family:'Plus Jakarta Sans',sans-serif; outline:none; transition:0.25s;
    }
    .skill-row input:focus { border-color:var(--blue); }
    .add-skill-btn {
      padding:10px 16px; background:var(--blue); color:white;
      border:none; border-radius:8px; font-size:13px; font-weight:700;
      cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; transition:0.25s; white-space:nowrap;
    }
    .add-skill-btn:hover { background:var(--blue-dark); }

    /* ENTRY BLOCKS */
    .entry-block {
      border:1px solid var(--border); border-radius:10px;
      padding:16px; margin-bottom:12px; position:relative; background:white;
    }
    .remove-btn {
      position:absolute; top:12px; right:12px;
      background:#fee2e2; color:var(--red); border:none; border-radius:6px;
      padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer;
      font-family:'Plus Jakarta Sans',sans-serif; transition:0.2s;
    }
    .remove-btn:hover { background:#fecaca; }
    .add-entry-btn {
      width:100%; padding:11px; border:2px dashed var(--border);
      border-radius:8px; background:transparent; color:var(--text-soft);
      font-size:13px; font-weight:600; cursor:pointer;
      font-family:'Plus Jakarta Sans',sans-serif; transition:0.25s; margin-top:4px;
    }
    .add-entry-btn:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-light); }

    /* SUBMIT */
    .submit-wrap { margin-top:20px; }
    .submit-btn {
      width:100%; padding:16px; background:var(--blue); color:white;
      border:none; border-radius:12px; font-size:16px; font-weight:800;
      cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; transition:0.25s;
      box-shadow:0 6px 20px rgba(37,99,235,0.35);
    }
    .submit-btn:hover { background:var(--blue-dark); transform:translateY(-2px); box-shadow:0 10px 28px rgba(37,99,235,0.4); }

    /* RIGHT PANEL — PREVIEW */
    .preview-panel {
      background:#e2e8f0;
      display:flex; flex-direction:column;
      align-items:center;
      padding:32px 24px 60px;
      overflow-y:auto;
    }

    .preview-toolbar {
      width:100%; max-width:700px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:20px;
    }
    .preview-label {
      font-size:12px; font-weight:700; color:var(--text-soft);
      text-transform:uppercase; letter-spacing:1px;
    }
    .preview-actions { display:flex; gap:8px; }

    /* ========== RESUME PREVIEWS ========== */
    #resumePreview {
      width:100%; max-width:700px;
      background:white;
      box-shadow:0 8px 40px rgba(0,0,0,0.15);
      border-radius:4px;
      min-height:900px;
      transition:all 0.3s;
    }

    /* ---- MODERN TEMPLATE ---- */
    .tpl-modern { font-family:'Plus Jakarta Sans',sans-serif; }
    .tpl-modern .r-header { background:#1e293b; color:white; padding:36px 40px; }
    .tpl-modern .r-name { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; letter-spacing:-0.5px; }
    .tpl-modern .r-title { font-size:14px; color:rgba(255,255,255,0.6); margin-top:4px; }
    .tpl-modern .r-contacts { display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; font-size:12px; color:rgba(255,255,255,0.7); }
    .tpl-modern .r-body { display:grid; grid-template-columns:1fr 2fr; }
    .tpl-modern .r-sidebar { background:#f8fafc; padding:28px 24px; border-right:1px solid var(--border); }
    .tpl-modern .r-main { padding:28px 32px; }
    .tpl-modern .r-sec-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; color:var(--blue); margin-bottom:12px; margin-top:22px; }
    .tpl-modern .r-sec-title:first-child { margin-top:0; }
    .tpl-modern .r-skill-pill { display:inline-block; background:var(--blue-light); color:var(--blue); padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; margin:3px 2px; }
    .tpl-modern .r-entry { margin-bottom:18px; }
    .tpl-modern .r-entry-title { font-size:14px; font-weight:700; }
    .tpl-modern .r-entry-sub { font-size:12px; color:var(--text-soft); margin-top:2px; }
    .tpl-modern .r-entry-date { font-size:11px; color:var(--blue); font-weight:600; margin-top:2px; }
    .tpl-modern .r-entry-desc { font-size:12px; color:var(--text-soft); margin-top:6px; line-height:1.7; }
    .tpl-modern .r-summary { font-size:13px; color:var(--text-soft); line-height:1.8; }

    /* ---- MINIMAL TEMPLATE ---- */
    .tpl-minimal { font-family:'Plus Jakarta Sans',sans-serif; padding:44px 48px; }
    .tpl-minimal .r-name { font-family:'Syne',sans-serif; font-size:30px; font-weight:800; letter-spacing:-1px; }
    .tpl-minimal .r-title { font-size:15px; color:var(--text-soft); margin-top:4px; }
    .tpl-minimal .r-contacts { display:flex; flex-wrap:wrap; gap:16px; margin-top:10px; font-size:12px; color:var(--text-soft); }
    .tpl-minimal .r-divider { border:none; border-top:2px solid var(--text); margin:20px 0 16px; }
    .tpl-minimal .r-sec-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:2px; margin-bottom:14px; margin-top:24px; }
    .tpl-minimal .r-entry { display:grid; grid-template-columns:1fr 3fr; gap:16px; margin-bottom:14px; }
    .tpl-minimal .r-entry-left { font-size:11px; color:var(--text-soft); font-weight:600; padding-top:2px; }
    .tpl-minimal .r-entry-title { font-size:14px; font-weight:700; }
    .tpl-minimal .r-entry-sub { font-size:12px; color:var(--text-soft); margin-top:2px; }
    .tpl-minimal .r-entry-desc { font-size:12px; color:var(--text-soft); margin-top:5px; line-height:1.7; }
    .tpl-minimal .r-skills-row { display:flex; flex-wrap:wrap; gap:8px; }
    .tpl-minimal .r-skill-tag { font-size:12px; font-weight:600; padding:4px 12px; border:1px solid var(--border); border-radius:4px; }
    .tpl-minimal .r-summary { font-size:13px; color:var(--text-soft); line-height:1.8; }

    /* ---- CORPORATE TEMPLATE ---- */
    .tpl-corporate { font-family:'Plus Jakarta Sans',sans-serif; }
    .tpl-corporate .r-header { background:linear-gradient(135deg,#1d4ed8,#1e3a8a); color:white; padding:36px 40px; }
    .tpl-corporate .r-name { font-family:'Syne',sans-serif; font-size:26px; font-weight:800; }
    .tpl-corporate .r-title { font-size:14px; color:rgba(255,255,255,0.7); margin-top:4px; }
    .tpl-corporate .r-contacts { display:flex; flex-wrap:wrap; gap:20px; margin-top:14px; font-size:12px; color:rgba(255,255,255,0.8); }
    .tpl-corporate .r-body { padding:32px 40px; }
    .tpl-corporate .r-sec-title { font-size:14px; font-weight:800; color:#1d4ed8; border-bottom:2px solid #1d4ed8; padding-bottom:6px; margin-bottom:16px; margin-top:26px; text-transform:uppercase; letter-spacing:0.5px; }
    .tpl-corporate .r-sec-title:first-child { margin-top:0; }
    .tpl-corporate .r-entry { margin-bottom:18px; padding-left:14px; border-left:3px solid #dbeafe; }
    .tpl-corporate .r-entry-title { font-size:14px; font-weight:700; }
    .tpl-corporate .r-entry-sub { font-size:12px; color:var(--text-soft); }
    .tpl-corporate .r-entry-date { font-size:11px; color:#1d4ed8; font-weight:600; }
    .tpl-corporate .r-entry-desc { font-size:12px; color:var(--text-soft); margin-top:5px; line-height:1.7; }
    .tpl-corporate .r-skills-wrap { display:flex; flex-wrap:wrap; gap:8px; }
    .tpl-corporate .r-skill { background:#dbeafe; color:#1d4ed8; padding:4px 12px; border-radius:4px; font-size:12px; font-weight:600; }
    .tpl-corporate .r-summary { font-size:13px; color:var(--text-soft); line-height:1.8; }

    /* ---- DARK TEMPLATE ---- */
    .tpl-dark { font-family:'Plus Jakarta Sans',sans-serif; background:#111827; color:white; min-height:900px; }
    .tpl-dark .r-header { padding:36px 40px; border-bottom:1px solid rgba(255,255,255,0.08); }
    .tpl-dark .r-name { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; }
    .tpl-dark .r-title { font-size:14px; color:rgba(255,255,255,0.5); margin-top:4px; }
    .tpl-dark .r-contacts { display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-size:12px; color:rgba(255,255,255,0.5); }
    .tpl-dark .r-body { padding:28px 40px; }
    .tpl-dark .r-sec-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:2px; color:#60a5fa; margin-bottom:14px; margin-top:26px; }
    .tpl-dark .r-sec-title:first-child { margin-top:0; }
    .tpl-dark .r-entry { margin-bottom:18px; }
    .tpl-dark .r-entry-title { font-size:14px; font-weight:700; color:white; }
    .tpl-dark .r-entry-sub { font-size:12px; color:rgba(255,255,255,0.5); }
    .tpl-dark .r-entry-date { font-size:11px; color:#60a5fa; font-weight:600; }
    .tpl-dark .r-entry-desc { font-size:12px; color:rgba(255,255,255,0.6); margin-top:5px; line-height:1.7; }
    .tpl-dark .r-skill { display:inline-block; background:rgba(96,165,250,0.15); color:#60a5fa; border:1px solid rgba(96,165,250,0.3); padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; margin:3px 2px; }
    .tpl-dark .r-summary { font-size:13px; color:rgba(255,255,255,0.6); line-height:1.8; }

    /* ---- CLEAN BLUE TEMPLATE ---- */
    .tpl-clean { font-family:'Plus Jakarta Sans',sans-serif; padding:44px 48px; }
    .tpl-clean .r-header-row { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; }
    .tpl-clean .r-name { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; color:var(--blue); }
    .tpl-clean .r-title { font-size:14px; color:var(--text-soft); margin-top:3px; }
    .tpl-clean .r-contacts { font-size:12px; color:var(--text-soft); text-align:right; line-height:1.9; }
    .tpl-clean .r-divider { height:4px; background:linear-gradient(90deg,var(--blue),#4f46e5); border-radius:2px; margin-bottom:24px; }
    .tpl-clean .r-sec-title { font-size:13px; font-weight:800; color:var(--blue); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; margin-top:22px; }
    .tpl-clean .r-sec-title:first-child { margin-top:0; }
    .tpl-clean .r-entry { margin-bottom:16px; }
    .tpl-clean .r-entry-title { font-size:14px; font-weight:700; }
    .tpl-clean .r-entry-sub { font-size:12px; color:var(--text-soft); }
    .tpl-clean .r-entry-date { font-size:11px; color:var(--blue); font-weight:600; float:right; }
    .tpl-clean .r-entry-desc { font-size:12px; color:var(--text-soft); margin-top:5px; line-height:1.7; }
    .tpl-clean .r-skill { display:inline-block; background:var(--blue-light); color:var(--blue); padding:4px 12px; border-radius:4px; font-size:12px; font-weight:600; margin:3px 2px; }
    .tpl-clean .r-summary { font-size:13px; color:var(--text-soft); line-height:1.8; }

    /* TOAST */
    .toast {
      position:fixed; bottom:24px; right:24px;
      background:#0f172a; color:white; padding:13px 20px;
      border-radius:10px; font-size:13px; font-weight:600;
      box-shadow:0 8px 24px rgba(0,0,0,0.2);
      transform:translateY(80px); opacity:0;
      transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      z-index:9999;
    }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { border-left:4px solid var(--green); }
    .toast.error { border-left:4px solid var(--red); }

    /* MOBILE */
    @media(max-width:900px) {
      .builder-layout { grid-template-columns:1fr; }
      .form-panel { height:auto; position:static; }
      .preview-panel { padding:24px 12px; }
      #resumePreview { max-width:100%; }
      .template-tabs { grid-template-columns:repeat(4,1fr); }
    }
    @media(max-width:600px) {
      .form-row { grid-template-columns:1fr; }
      .form-inner { padding:20px 16px 40px; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">Smart<span>CV</span></div>
    <div class="nav-right">
      <a href="index.html" class="back-btn">← Home</a>
      <button class="download-btn" onclick="downloadPDF()">⬇ Download PDF</button>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="builder-layout">

    <!-- ===== LEFT: FORM ===== -->
    <div class="form-panel">
      <div class="form-inner">
        <h1 class="panel-title">📝 Build Your Resume</h1>
        <p class="panel-sub">Fill in your details — preview updates live!</p>

        <!-- TEMPLATE SWITCHER -->
        <div class="template-switcher">
          <label>Choose Template</label>
          <div class="template-tabs">
            <button class="t-tab active" onclick="switchTemplate('modern',this)">
              <span class="t-dot" style="background:#1e293b;"></span>Modern
            </button>
            <button class="t-tab" onclick="switchTemplate('minimal',this)">
              <span class="t-dot" style="background:#f1f5f9;border:1px solid #e2e8f0;"></span>Minimal
            </button>
            <button class="t-tab" onclick="switchTemplate('corporate',this)">
              <span class="t-dot" style="background:#1d4ed8;"></span>Corporate
            </button>
            <button class="t-tab" onclick="switchTemplate('dark',this)">
              <span class="t-dot" style="background:#111827;"></span>Dark
            </button>
            <button class="t-tab" onclick="switchTemplate('creative',this)">
              <span class="t-dot" style="background:linear-gradient(135deg,#7c3aed,#db2777);"></span>Creative
            </button>
            <button class="t-tab" onclick="switchTemplate('elegant',this)">
              <span class="t-dot" style="background:#065f46;"></span>Elegant
            </button>
            <button class="t-tab" onclick="switchTemplate('bold',this)">
              <span class="t-dot" style="background:#dc2626;"></span>Bold
            </button>
            <button class="t-tab" onclick="switchTemplate('clean',this)">
              <span class="t-dot" style="background:#2563eb;"></span>Clean
            </button>
          </div>
        </div>

        <!-- PERSONAL INFO -->
        <div class="form-section">
          <div class="sec-head" onclick="toggleSection(this)">
            <div class="sec-icon">👤</div>
            <h3>Personal Information</h3>
            <span class="sec-toggle open">▼</span>
          </div>
          <div class="sec-body">
            <div class="form-row">
              <div class="field"><label>Full Name *</label><input type="text" id="fullName" placeholder="John Smith" oninput="updatePreview();updateProgress()"/></div>
              <div class="field"><label>Job Title *</label><input type="text" id="jobTitle" placeholder="Frontend Developer" oninput="updatePreview();updateProgress()"/></div>
            </div>
            <div class="form-row">
              <div class="field"><label>Email *</label><input type="email" id="email" placeholder="john@example.com" oninput="updatePreview();updateProgress()"/></div>
              <div class="field"><label>Phone</label><input type="tel" id="phone" placeholder="+92 300 1234567" oninput="updatePreview()"/></div>
            </div>
            <div class="form-row">
              <div class="field"><label>City / Location</label><input type="text" id="location" placeholder="Lahore, Pakistan" oninput="updatePreview()"/></div>
              <div class="field"><label>LinkedIn</label><input type="text" id="linkedin" placeholder="linkedin.com/in/johnsmith" oninput="updatePreview()"/></div>
            </div>
            <div class="form-row full">
              <div class="field"><label>Professional Summary</label><textarea id="summary" placeholder="2–3 sentences about your experience, strengths, and goals..." oninput="updatePreview()"></textarea></div>
            </div>
          </div>
        </div>

        <!-- SKILLS -->
        <div class="form-section">
          <div class="sec-head" onclick="toggleSection(this)">
            <div class="sec-icon">⚡</div>
            <h3>Skills</h3>
            <span class="sec-toggle open">▼</span>
          </div>
          <div class="sec-body">
            <div class="skills-wrap" id="skillsWrap"></div>
            <div class="skill-row">
              <input type="text" id="skillInput" placeholder="e.g. JavaScript, Photoshop..." onkeydown="if(event.key==='Enter') addSkill()"/>
              <button class="add-skill-btn" onclick="addSkill()">+ Add</button>
            </div>
          </div>
        </div>

        <!-- EDUCATION -->
        <div class="form-section">
          <div class="sec-head" onclick="toggleSection(this)">
            <div class="sec-icon">🎓</div>
            <h3>Education</h3>
            <span class="sec-toggle open">▼</span>
          </div>
          <div class="sec-body">
            <div id="educationList"></div>
            <button class="add-entry-btn" onclick="addEducation()">+ Add Education</button>
          </div>
        </div>

        <!-- EXPERIENCE -->
        <div class="form-section">
          <div class="sec-head" onclick="toggleSection(this)">
            <div class="sec-icon">💼</div>
            <h3>Work Experience</h3>
            <span class="sec-toggle open">▼</span>
          </div>
          <div class="sec-body">
            <div id="experienceList"></div>
            <button class="add-entry-btn" onclick="addExperience()">+ Add Experience</button>
          </div>
        </div>

        <!-- SUBMIT -->
        <div class="submit-wrap">
          <button class="submit-btn" onclick="generateResume()">Generate & Download PDF →</button>
        </div>
      </div>
    </div>

    <!-- ===== RIGHT: PREVIEW ===== -->
    <div class="preview-panel">
      <div class="preview-toolbar">
        <span class="preview-label">👁 Live Preview</span>
        <div class="preview-actions">
          <button class="download-btn" onclick="downloadPDF()">⬇ Download PDF</button>
        </div>
      </div>
      <div id="resumePreview">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    let skills = [];
    let eduCount = 0;
    let expCount = 0;
    let currentTemplate = 'modern';

    // ===== INIT =====
    window.onload = () => {
      const saved = localStorage.getItem('smartcv_template');
      if (saved) currentTemplate = saved;

      // Mark active tab
      document.querySelectorAll('.t-tab').forEach(t => {
        t.classList.toggle('active', t.getAttribute('onclick').includes(`'${currentTemplate}'`));
      });

      addEducation();
      addExperience();
      updatePreview();
      updateProgress();
    };

    // ===== PROGRESS =====
    function updateProgress() {
      const vals = ['fullName','jobTitle','email'].map(id => document.getElementById(id).value.trim());
      const filled = vals.filter(Boolean).length;
      document.getElementById('progressBar').style.width = Math.round((filled/3)*100) + '%';
    }

    // ===== TOGGLE SECTIONS =====
    function toggleSection(head) {
      const body = head.nextElementSibling;
      const toggle = head.querySelector('.sec-toggle');
      body.classList.toggle('hidden');
      toggle.classList.toggle('open');
    }

    // ===== TEMPLATE =====
    function switchTemplate(name, btn) {
      currentTemplate = name;
      document.querySelectorAll('.t-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      localStorage.setItem('smartcv_template', name);
      updatePreview();
    }

    // ===== SKILLS =====
    function addSkill() {
      const input = document.getElementById('skillInput');
      const val = input.value.trim();
      if (!val || skills.includes(val)) { input.value=''; return; }
      skills.push(val);
      renderSkills();
      input.value = '';
      updatePreview();
    }
    function removeSkill(skill) {
      skills = skills.filter(s => s !== skill);
      renderSkills();
      updatePreview();
    }
    function renderSkills() {
      document.getElementById('skillsWrap').innerHTML = skills.map(s => `
        <div class="skill-tag">${s}<button onclick="removeSkill('${s.replace(/'/g,'\\\'')}')" title="Remove">×</button></div>
      `).join('');
    }

    // ===== EDUCATION =====
    function addEducation() {
      eduCount++;
      const id = 'edu_' + eduCount;
      const el = document.createElement('div');
      el.className = 'entry-block'; el.id = id;
      el.innerHTML = `
        <button class="remove-btn" onclick="removeEntry('${id}')">✕ Remove</button>
        <div class="form-row">
          <div class="field"><label>Degree</label><input type="text" placeholder="Bachelor of CS" oninput="updatePreview()"/></div>
          <div class="field"><label>Institution</label><input type="text" placeholder="University of Punjab" oninput="updatePreview()"/></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Start Year</label><input type="text" placeholder="2020" oninput="updatePreview()"/></div>
          <div class="field"><label>End Year</label><input type="text" placeholder="2024 or Present" oninput="updatePreview()"/></div>
        </div>
        <div class="form-row full">
          <div class="field"><label>Notes (optional)</label><textarea placeholder="GPA, relevant courses..." oninput="updatePreview()"></textarea></div>
        </div>
      `;
      document.getElementById('educationList').appendChild(el);
    }

    // ===== EXPERIENCE =====
    function addExperience() {
      expCount++;
      const id = 'exp_' + expCount;
      const el = document.createElement('div');
      el.className = 'entry-block'; el.id = id;
      el.innerHTML = `
        <button class="remove-btn" onclick="removeEntry('${id}')">✕ Remove</button>
        <div class="form-row">
          <div class="field"><label>Job Title</label><input type="text" placeholder="Frontend Developer" oninput="updatePreview()"/></div>
          <div class="field"><label>Company</label><input type="text" placeholder="Tech Solutions Ltd" oninput="updatePreview()"/></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Start Date</label><input type="text" placeholder="Jan 2022" oninput="updatePreview()"/></div>
          <div class="field"><label>End Date</label><input type="text" placeholder="Present" oninput="updatePreview()"/></div>
        </div>
        <div class="form-row full">
          <div class="field"><label>Responsibilities</label><textarea placeholder="• Built responsive UIs&#10;• Improved performance by 40%&#10;• Collaborated with teams" oninput="updatePreview()"></textarea></div>
        </div>
      `;
      document.getElementById('experienceList').appendChild(el);
    }

    function removeEntry(id) {
      const el = document.getElementById(id);
      if (el) { el.remove(); updatePreview(); }
    }

    // ===== COLLECT DATA =====
    function collectData() {
      const g = id => document.getElementById(id)?.value?.trim() || '';

      // Education
      const eduBlocks = document.querySelectorAll('#educationList .entry-block');
      const education = [...eduBlocks].map(b => {
        const inputs = b.querySelectorAll('input,textarea');
        return { degree:inputs[0]?.value||'', school:inputs[1]?.value||'', start:inputs[2]?.value||'', end:inputs[3]?.value||'', notes:inputs[4]?.value||'' };
      });

      // Experience
      const expBlocks = document.querySelectorAll('#experienceList .entry-block');
      const experience = [...expBlocks].map(b => {
        const inputs = b.querySelectorAll('input,textarea');
        return { title:inputs[0]?.value||'', company:inputs[1]?.value||'', start:inputs[2]?.value||'', end:inputs[3]?.value||'', desc:inputs[4]?.value||'' };
      });

      return { name:g('fullName'), jobTitle:g('jobTitle'), email:g('email'), phone:g('phone'), location:g('location'), linkedin:g('linkedin'), summary:g('summary'), skills, education, experience };
    }

    // ===== RENDER RESUME =====
    function updatePreview() {
      const d = collectData();
      const el = document.getElementById('resumePreview');
      el.innerHTML = renderTemplate(currentTemplate, d);
    }

    function renderTemplate(tpl, d) {
      switch(tpl) {
        case 'minimal': return renderMinimal(d);
        case 'corporate': return renderCorporate(d);
        case 'dark': return renderDark(d);
        case 'creative': return renderCreative(d);
        case 'elegant': return renderElegant(d);
        case 'bold': return renderBold(d);
        case 'clean': return renderClean(d);
        default: return renderModern(d);
      }
    }

    function contactLine(d) {
      return [d.email, d.phone, d.location, d.linkedin].filter(Boolean).join(' &nbsp;·&nbsp; ');
    }

    function renderEduList(d, cls) {
      return d.education.filter(e=>e.degree||e.school).map(e => `
        <div class="${cls.entry}">
          <div class="${cls.title}">${e.degree||'Degree'}</div>
          <div class="${cls.sub}">${e.school||''}</div>
          <div class="${cls.date}">${[e.start,e.end].filter(Boolean).join(' – ')}</div>
          ${e.notes?`<div class="${cls.desc}">${e.notes}</div>`:''}
        </div>
      `).join('') || `<p style="font-size:12px;color:#94a3b8;">No education added yet.</p>`;
    }

    function renderExpList(d, cls) {
      return d.experience.filter(e=>e.title||e.company).map(e => `
        <div class="${cls.entry}">
          <div class="${cls.title}">${e.title||'Role'}</div>
          <div class="${cls.sub}">${e.company||''}</div>
          <div class="${cls.date}">${[e.start,e.end].filter(Boolean).join(' – ')}</div>
          ${e.desc?`<div class="${cls.desc}">${e.desc.replace(/\n/g,'<br>')}</div>`:''}
        </div>
      `).join('') || `<p style="font-size:12px;color:#94a3b8;">No experience added yet.</p>`;
    }

    // MODERN
    function renderModern(d) {
      const cls = { entry:'r-entry', title:'r-entry-title', sub:'r-entry-sub', date:'r-entry-date', desc:'r-entry-desc' };
      return `<div class="tpl-modern">
        <div class="r-header">
          <div class="r-name">${d.name||'Your Name'}</div>
          <div class="r-title">${d.jobTitle||'Job Title'}</div>
          <div class="r-contacts">${contactLine(d)||'email · phone · location'}</div>
        </div>
        <div class="r-body">
          <div class="r-sidebar">
            ${d.summary?`<div class="r-sec-title">About</div><div class="r-summary">${d.summary}</div>`:''}
            <div class="r-sec-title">Skills</div>
            ${d.skills.length ? d.skills.map(s=>`<span class="r-skill-pill">${s}</span>`).join('') : '<span style="font-size:12px;color:#94a3b8;">No skills added</span>'}
            <div class="r-sec-title">Education</div>
            ${renderEduList(d,cls)}
          </div>
          <div class="r-main">
            <div class="r-sec-title">Work Experience</div>
            ${renderExpList(d,cls)}
          </div>
        </div>
      </div>`;
    }

    // MINIMAL
    function renderMinimal(d) {
      return `<div class="tpl-minimal">
        <div class="r-name">${d.name||'Your Name'}</div>
        <div class="r-title">${d.jobTitle||'Job Title'}</div>
        <div class="r-contacts">${contactLine(d)||'email · phone · location'}</div>
        <hr class="r-divider"/>
        ${d.summary?`<div class="r-sec-title">Profile</div><div class="r-summary">${d.summary}</div>`:''}
        <div class="r-sec-title">Experience</div>
        ${d.experience.filter(e=>e.title||e.company).map(e=>`
          <div class="r-entry">
            <div class="r-entry-left">${[e.start,e.end].filter(Boolean).join('–')}</div>
            <div>
              <div class="r-entry-title">${e.title||'Role'}</div>
              <div class="r-entry-sub">${e.company||''}</div>
              ${e.desc?`<div class="r-entry-desc">${e.desc.replace(/\n/g,'<br>')}</div>`:''}
            </div>
          </div>`).join('')||'<p style="font-size:12px;color:#94a3b8;">No experience added yet.</p>'}
        <div class="r-sec-title">Education</div>
        ${d.education.filter(e=>e.degree||e.school).map(e=>`
          <div class="r-entry">
            <div class="r-entry-left">${[e.start,e.end].filter(Boolean).join('–')}</div>
            <div>
              <div class="r-entry-title">${e.degree||'Degree'}</div>
              <div class="r-entry-sub">${e.school||''}</div>
              ${e.notes?`<div class="r-entry-desc">${e.notes}</div>`:''}
            </div>
          </div>`).join('')||'<p style="font-size:12px;color:#94a3b8;">No education added yet.</p>'}
        <div class="r-sec-title">Skills</div>
        <div class="r-skills-row">${d.skills.length?d.skills.map(s=>`<span class="r-skill-tag">${s}</span>`).join(''):'<span style="font-size:12px;color:#94a3b8;">No skills added</span>'}</div>
      </div>`;
    }

    // CORPORATE
    function renderCorporate(d) {
      const cls = { entry:'r-entry', title:'r-entry-title', sub:'r-entry-sub', date:'r-entry-date', desc:'r-entry-desc' };
      return `<div class="tpl-corporate">
        <div class="r-header">
          <div class="r-name">${d.name||'Your Name'}</div>
          <div class="r-title">${d.jobTitle||'Job Title'}</div>
          <div class="r-contacts">${contactLine(d)||'email · phone · location'}</div>
        </div>
        <div class="r-body">
          ${d.summary?`<div class="r-sec-title">Professional Summary</div><div class="r-summary">${d.summary}</div>`:''}
          <div class="r-sec-title">Work Experience</div>
          ${renderExpList(d,cls)}
          <div class="r-sec-title">Education</div>
          ${renderEduList(d,cls)}
          <div class="r-sec-title">Skills</div>
          <div class="r-skills-wrap">${d.skills.length?d.skills.map(s=>`<span class="r-skill">${s}</span>`).join(''):'<span style="font-size:12px;color:#94a3b8;">No skills added</span>'}</div>
        </div>
      </div>`;
    }

    // DARK
    function renderDark(d) {
      const cls = { entry:'r-entry', title:'r-entry-title', sub:'r-entry-sub', date:'r-entry-date', desc:'r-entry-desc' };
      return `<div class="tpl-dark">
        <div class="r-header">
          <div class="r-name">${d.name||'Your Name'}</div>
          <div class="r-title">${d.jobTitle||'Job Title'}</div>
          <div class="r-contacts">${contactLine(d)||'email · phone · location'}</div>
        </div>
        <div class="r-body">
          ${d.summary?`<div class="r-sec-title">About Me</div><div class="r-summary">${d.summary}</div>`:''}
          <div class="r-sec-title">Experience</div>
          ${renderExpList(d,cls)}
          <div class="r-sec-title">Education</div>
          ${renderEduList(d,cls)}
          <div class="r-sec-title">Skills</div>
          ${d.skills.length?d.skills.map(s=>`<span class="r-skill">${s}</span>`).join(''):'<span style="font-size:12px;color:rgba(255,255,255,0.3);">No skills added</span>'}
        </div>
      </div>`;
    }

    // CREATIVE (purple gradient)
    function renderCreative(d) {
      const cls = { entry:'r-entry', title:'r-entry-title', sub:'r-entry-sub', date:'r-entry-date', desc:'r-entry-desc' };
      return `<div style="font-family:'Plus Jakarta Sans',sans-serif;">
        <div style="background:linear-gradient(135deg,#7c3aed,#db2777);color:white;padding:36px 40px;">
          <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;">${d.name||'Your Name'}</div>
          <div style="font-size:14px;color:rgba(255,255,255,0.7);margin-top:4px;">${d.jobTitle||'Job Title'}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:12px;">${contactLine(d)||'email · phone · location'}</div>
        </div>
        <div style="padding:28px 40px;">
          ${d.summary?`<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#7c3aed;margin-bottom:10px;">About</div><div style="font-size:13px;color:#64748b;line-height:1.8;margin-bottom:20px;">${d.summary}</div>`:''}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#7c3aed;margin-bottom:12px;">Experience</div>
          ${renderExpList(d,cls)}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#7c3aed;margin:20px 0 12px;">Education</div>
          ${renderEduList(d,cls)}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#7c3aed;margin:20px 0 10px;">Skills</div>
          ${d.skills.length?d.skills.map(s=>`<span style="display:inline-block;background:#f5f3ff;color:#7c3aed;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin:3px 2px;">${s}</span>`).join(''):'<span style="font-size:12px;color:#94a3b8;">No skills added</span>'}
        </div>
      </div>`;
    }

    // ELEGANT (green)
    function renderElegant(d) {
      const cls = { entry:'r-entry', title:'r-entry-title', sub:'r-entry-sub', date:'r-entry-date', desc:'r-entry-desc' };
      return `<div style="font-family:'Plus Jakarta Sans',sans-serif;">
        <div style="background:linear-gradient(135deg,#064e3b,#065f46);color:white;padding:36px 40px;">
          <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;">${d.name||'Your Name'}</div>
          <div style="font-size:14px;color:rgba(255,255,255,0.7);margin-top:4px;">${d.jobTitle||'Job Title'}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:12px;">${contactLine(d)||'email · phone · location'}</div>
        </div>
        <div style="padding:28px 40px;">
          ${d.summary?`<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#065f46;margin-bottom:10px;">Summary</div><div style="font-size:13px;color:#64748b;line-height:1.8;margin-bottom:20px;">${d.summary}</div>`:''}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#065f46;margin-bottom:12px;">Experience</div>
          ${renderExpList(d,cls)}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#065f46;margin:20px 0 12px;">Education</div>
          ${renderEduList(d,cls)}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#065f46;margin:20px 0 10px;">Skills</div>
          ${d.skills.length?d.skills.map(s=>`<span style="display:inline-block;background:#ecfdf5;color:#065f46;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:600;margin:3px 2px;">${s}</span>`).join(''):'<span style="font-size:12px;color:#94a3b8;">No skills added</span>'}
        </div>
      </div>`;
    }

    // BOLD (red)
    function renderBold(d) {
      const cls = { entry:'r-entry', title:'r-entry-title', sub:'r-entry-sub', date:'r-entry-date', desc:'r-entry-desc' };
      return `<div style="font-family:'Plus Jakarta Sans',sans-serif;">
        <div style="background:linear-gradient(135deg,#dc2626,#9f1239);color:white;padding:36px 40px;">
          <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;">${d.name||'Your Name'}</div>
          <div style="font-size:14px;color:rgba(255,255,255,0.7);margin-top:4px;">${d.jobTitle||'Job Title'}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:12px;">${contactLine(d)||'email · phone · location'}</div>
        </div>
        <div style="padding:28px 40px;">
          ${d.summary?`<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#dc2626;margin-bottom:10px;">Summary</div><div style="font-size:13px;color:#64748b;line-height:1.8;margin-bottom:20px;">${d.summary}</div>`:''}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#dc2626;margin-bottom:12px;">Experience</div>
          ${renderExpList(d,cls)}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#dc2626;margin:20px 0 12px;">Education</div>
          ${renderEduList(d,cls)}
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#dc2626;margin:20px 0 10px;">Skills</div>
          ${d.skills.length?d.skills.map(s=>`<span style="display:inline-block;background:#fff1f2;color:#dc2626;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:600;margin:3px 2px;">${s}</span>`).join(''):'<span style="font-size:12px;color:#94a3b8;">No skills added</span>'}
        </div>
      </div>`;
    }

    // CLEAN BLUE
    function renderClean(d) {
      return `<div class="tpl-clean">
        <div class="r-header-row">
          <div>
            <div class="r-name">${d.name||'Your Name'}</div>
            <div class="r-title">${d.jobTitle||'Job Title'}</div>
          </div>
          <div class="r-contacts">${[d.email,d.phone,d.location].filter(Boolean).join('<br>')||'email<br>phone'}</div>
        </div>
        <div class="r-divider"></div>
        ${d.summary?`<div class="r-sec-title">Summary</div><div class="r-summary">${d.summary}</div>`:''}
        <div class="r-sec-title">Experience</div>
        ${d.experience.filter(e=>e.title||e.company).map(e=>`
          <div class="r-entry">
            <span class="r-entry-date">${[e.start,e.end].filter(Boolean).join(' – ')}</span>
            <div class="r-entry-title">${e.title||'Role'}</div>
            <div class="r-entry-sub">${e.company||''}</div>
            ${e.desc?`<div class="r-entry-desc">${e.desc.replace(/\n/g,'<br>')}</div>`:''}
          </div>`).join('')||'<p style="font-size:12px;color:#94a3b8;">No experience added yet.</p>'}
        <div class="r-sec-title">Education</div>
        ${d.education.filter(e=>e.degree||e.school).map(e=>`
          <div class="r-entry">
            <span class="r-entry-date">${[e.start,e.end].filter(Boolean).join(' – ')}</span>
            <div class="r-entry-title">${e.degree||'Degree'}</div>
            <div class="r-entry-sub">${e.school||''}</div>
            ${e.notes?`<div class="r-entry-desc">${e.notes}</div>`:''}
          </div>`).join('')||'<p style="font-size:12px;color:#94a3b8;">No education added yet.</p>'}
        <div class="r-sec-title">Skills</div>
        ${d.skills.length?d.skills.map(s=>`<span class="r-skill">${s}</span>`).join(''):'<span style="font-size:12px;color:#94a3b8;">No skills added</span>'}
      </div>`;
    }

    // ===== GENERATE / SAVE =====
    function generateResume() {
      const name  = document.getElementById('fullName').value.trim();
      const title = document.getElementById('jobTitle').value.trim();
      const email = document.getElementById('email').value.trim();
      if (!name || !title || !email) {
        showToast('Please fill in Name, Job Title, and Email.', 'error'); return;
      }
      updatePreview();
      localStorage.setItem('smartcv_resume', JSON.stringify(collectData()));
      downloadPDF();
    }

    // ===== PDF DOWNLOAD =====
    function downloadPDF() {
      const name = document.getElementById('fullName').value.trim() || 'resume';
      const el = document.getElementById('resumePreview');
      showToast('⏳ Preparing your PDF...');
      const opt = {
        margin: 0,
        filename: `${name.replace(/\s+/g,'_')}_resume.pdf`,
        image: { type:'jpeg', quality:0.98 },
        html2canvas: { scale:2, useCORS:true, backgroundColor:'#ffffff' },
        jsPDF: { unit:'mm', format:'a4', orientation:'portrait' }
      };
      html2pdf().set(opt).from(el).save().then(() => {
        showToast('✅ PDF downloaded!', 'success');
      });
    }

    // ===== TOAST =====
    function showToast(msg, type='success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 3200);
    }
  </script>
</body>
</html>
